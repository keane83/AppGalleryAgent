<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harmony Auto App Agent</title>
  <link rel="stylesheet" href="/static/style.css?v=3" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div>
        <h1>Harmony Auto App Agent</h1>
        <p class="subtitle">鸿蒙应用商店自动化 · LangGraph + 本地 Ollama</p>
      </div>
      <div class="status" id="status">
        <span class="dot"></span>
        <span id="status-text">连接中...</span>
      </div>
    </header>

    <main class="chat" id="chat"></main>

    <footer class="composer">
      <form id="chat-form">
        <textarea
          id="message-input"
          rows="1"
          placeholder="输入消息，Enter 发送，Shift+Enter 换行..."
          autofocus
        ></textarea>
        <button type="submit" id="send-btn">发送</button>
      </form>
      <p class="hint">思考过程会以较小、较浅的字号显示；下方为正式回答。</p>
    </footer>
  </div>

  <script src="/static/app.js?v=3"></script>
</body>
</html>
